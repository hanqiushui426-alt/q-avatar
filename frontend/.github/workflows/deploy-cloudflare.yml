name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master, clean-master, main]

  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build Next.js
        working-directory: ./frontend
        run: npm run build

      - name: Run @cloudflare/next-on-pages
        working-directory: ./frontend
        run: npx @cloudflare/next-on-pages

      - name: Deploy to Cloudflare Pages
        run: |
          # Upload the static files to Cloudflare Pages
          response=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/q-avatar/deployments" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{
              "branch": "main",
              "skipReview": true,
              "manifest": {}
            }')
          
          echo "Deployment response: $response"
          
          # Get the deployment ID
          deployment_id=$(echo $response | jq -r '.result.id')
          echo "Deployment ID: $deployment_id"
          
          # Wait for deployment to complete
          while true; do
            status=$(curl -s \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/q-avatar/deployments/$deployment_id" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -r '.result.latest_stage.status')
            
            echo "Deployment status: $status"
            
            if [ "$status" = "success" ]; then
              echo "Deployment successful!"
              break
            elif [ "$status" = "failure" ]; then
              echo "Deployment failed!"
              exit 1
            fi
            
            sleep 10
          done
